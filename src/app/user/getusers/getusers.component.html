<div class="col-lg-12">
    <div class="card">
        <div class="card-body">
            <div class="active-member">
                <div class="table-responsive">
                    <table class="table table-xs mb-0">
                        <thead>
                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>CIN</th>
                                <th>Phone Number</th>
                                <th>Date Of Birth</th>
                                <th>Is Employed</th>
                                <th>Is Verified</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr  *ngFor="let user of users">
                                <td><img src="./images/avatar/1.jpg" class=" rounded-circle mr-3" alt="">{{user.firstName}}</td>
                                <td>{{user.lastName}}</td>
                                <td>
                                    <span>{{user.email}}</span>
                                </td>
                                <td>{{user.cin}}</td>
                                <td>{{user.phoneNumber}}</td>
                                <td>{{user.dateOfBirth | date: 'dd/MM/yyyy'}}</td>
                                <td>
                                <span *ngIf="user.isEmployed">Employed</span>
                                <span *ngIf="!user.isEmployed">Not Employed</span>
                                </td>
                                <td>
                                    <span *ngIf="user.isVerified" class="mr-2">Verified<i class="fa fa-circle-o text-success"></i></span>
                                    <span *ngIf="!user.isVerified" class="btn btn-sucess btn-rounded btn-sm"><button class="btn btn-success btn-rounded btn-sm" data-toggle="modal" data-target="#editModal" (click)="verifuser(user.cin)">Verify Account</button></span>
                                <td>
                                    <button class="btn btn-danger btn-rounded btn-sm" (click)="deleteUser(user.idUser)"><span class="fa fa-times"></span></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>                        
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Verify User</h5>
          <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure to verify that user ?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="verifyuser()">Save changes</button>
        </div>
      </div>
    </div>
  </div>
