<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
</head>
<div class="alert alert-{{alertstyle}}" role="alert"> {{alertmessage}} </div>
<body class="text-center px-3"> 
    <div class="py-5"></div>
    <form class="{{formvalidation}}" #resetpassForm='ngForm' (submit)="Resetpassword(resetpassForm)">
        <img class="mb-4" src="assets/login/images/lock.png" alt="" width="100" height="100">
        <h1 class="h3 mb-3 fw-normal">Reset Password</h1>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-4">
          
            <div class="form-floating">
            <input required type="password" class="form-control" name="newpass" id="newpass" ngModel placeholder="Enter new Password">
            <label for="floatingPassword">New Password</label>
          </div>

          <div class="form-floating">
            <input required type="password" class="form-control" name="confirmpass" id="confirmpass" ngModel placeholder="Confirm">
            <label for="floatingPassword">Confirm Password</label>
          </div>

          <div class="py-1">
          <button type="button" onclick="window.location.href = '/user/login';" class="btn btn-primary">Return to Login</button>
          </div>

          <div class="py-1">
          <button type="submit" class="btn btn-primary">Apply</button>
          </div>
        </div>  
    </form>
</body>
