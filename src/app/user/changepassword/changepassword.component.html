<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
</head>

    <section class="vh-100">
      <div *ngIf="alertmessage != ''" class="alert alert-danger" role="alert">
        {{alertmessage}}
      </div>
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-items-center h-100">
        
        <form #changepwdForm='ngForm' (submit)="changepwd(changepwdForm)" autocomplete="off" class="justify-content-center {{formvalidation}}" novalidate>

            <div class="ui-g">
    
            <div class="ui-sm-12 ui-md-6 ui-g-6">
    
                <div style="padding-right: 15px;">
              <div class="row px-5 py-4"><h4>Change Password</h4></div>

              <div class="form-group row px-5 py-1">
                <label for="Actualpassword" class="col-sm-4 col-form-label"><b>Actual Password</b></label>
                <div class="d-flex col-sm-6">
                  <input required class="form-control" [maxLength]="25" placeholder="Actual Password"  type="password" name="Actualpassword" id="Actualpassword" [(ngModel)]="Actualpassword">
                  <div class="valid-feedback" style="margin-left: 10px;">
                    Looks good !
                  </div>
                  <div class="invalid-feedback" style="margin-left: 10px;">
                    Actual Password is required !
                  </div>
                </div>
              </div>
              
              <div class="form-group row px-5 py-1">
                <label for="password" class="col-sm-4 col-form-label"><b>Password</b></label>
                <div class="d-flex col-sm-6">
                  <input required class="form-control" [maxLength]="25" placeholder="Enter new password"  type="password" name="password" id="password" [(ngModel)]="password">
                  <div class="valid-feedback" style="margin-left: 10px;">
                    Looks good !
                  </div>
                  <div class="invalid-feedback" style="margin-left: 10px;">
                    password is required !
                  </div>
                </div>
              </div>

              <div class="form-group row px-5 py-1">
                <label for="confirmpassword" class="col-sm-4 col-form-label"><b>Confirm Password</b></label>
                <div class="d-flex col-sm-6">
                  <input required class="form-control" [maxLength]="25" placeholder="confirm your password" (keyup)="validateconfpass($event)"  type="password" name="confirmpassword" id="confirmpassword" [(ngModel)]="confirmpassword">
                  <div class="valid-feedback" style="margin-left: 10px;">
                    Looks good !
                  </div>
                  <div class="invalid-feedback" style="margin-left: 10px;">
                    please confirm your password !
                  </div>
                </div>
                <span style="color: brown;" class="badge rounded-pill text-bg-danger">{{validateconfirmpassword}}</span>
              </div>

            </div>
          </div>
          <div class="form-group row px-5 py-1"></div>
          <div class="ui-sm-12 ui-g-12" style="text-align:right; width:100%; padding:0;">
    
              <button onclick="window.location.href = '/user/getuser';" class="btn btn-secondary me-2" type="reset">Cancel</button>
              <!--onclick="window.location.href = 'user/login';"-->
              <button class="btn btn-primary" icon="pi pi-check" type="submit">Confirm 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2" viewBox="0 0 16 16">
                  <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                </svg>
              </button>
        </div>
        </div>
      </form>
    </div>
      </div>
  
</section>
