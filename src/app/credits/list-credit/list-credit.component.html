
<div class="container-fluid" style="margin-top: 1rem;">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title" *ngIf="isAdmin">Credits</h4>
              <div class="card-title" style="margin-left: 75rem;margin-bottom: 2rem;" *ngIf="!isAdmin"><button routerLink="/client/credits/simulate" class="btn btn-info">Simulate a loan!</button></div>
              <div class="table-responsive">
                <div
                  id="DataTables_Table_0_wrapper"
                  class="dataTables_wrapper container-fluid dt-bootstrap4"
                >
                  <div class="row">
                    <div class="col-sm-12">
                      <table
                        class="table table-striped table-bordered zero-configuration dataTable"
                        id="DataTables_Table_0"
                        role="grid"
                        aria-describedby="DataTables_Table_0_info"
                      >
                        <thead class="text-center">
                          <tr role="row">
                            <th
                              class="sorting_asc"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-sort="ascending"
                              aria-label="Name: activate to sort column descending"
                              style="width: 55.812px"
                            >
                              Id
                            </th>
                            <th
                              class="sorting"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-label="Position: activate to sort column ascending"
                              style="width: 177.156px"
                            >
                            Amount
                            </th>
                            <th
                              class="sorting"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-label="Office: activate to sort column ascending"
                              style="width: 127.172px"
                            >
                            Start date
                            </th>
                            <th
                              class="sorting"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-label="Age: activate to sort column ascending"
                              style="width: 142.828px"
                            >
                              Accept date
                            </th>
                            <th
                              class="sorting"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-label="Start date: activate to sort column ascending"
                              style="width: 142.828px"
                            >
                              Interest rate
                            </th>
                            <th
                              class="sorting"
                              tabindex="0"
                              aria-controls="DataTables_Table_0"
                              rowspan="1"
                              colspan="1"
                              aria-label="Salary: activate to sort column ascending"
                              style="width: 152.828px"
                            >
                                Status
                            </th>
                            <th
                            class="sorting"
                            tabindex="0"
                            aria-controls="DataTables_Table_0"
                            rowspan="1"
                            colspan="1"
                            aria-label="Start date: activate to sort column ascending"
                            style="width: 182.828px"
                          >
                            Action
                          </th>
                          </tr>
                        </thead>
                        <tbody class="text-center">
                          <tr role="row" class="odd" *ngFor="let credit of listCredit">
                            <td class="sorting_1">{{ credit.idCredit }}</td>
                            <td>{{ credit.amount }} dt</td>
                            <td *ngIf="credit.creditStartDate">{{ credit.creditStartDate }}</td>
                            <td *ngIf="!credit.creditStartDate"><i class="fa-solid fa-calendar-xmark"></i></td>
                            <td *ngIf="credit.creditStartDate">{{ credit.acceptDate }}</td>
                            <td *ngIf="!credit.creditStartDate">pending</td>
                            <td *ngIf="credit.creditStartDate">{{ credit.interestRate }} %</td>
                            <td *ngIf="!credit.creditStartDate"><i class="fa-solid fa-spinner fa-spin"></i></td>
                            <td>
                                <span *ngIf="credit.isPayed"><i class="fa-solid fa-check fa-xl" style="color:green"></i></span>
                                <span *ngIf="!credit.isPayed"><i class="fa-solid fa-spinner fa-spin"></i></span>
                            </td>
                            <td class="group-btn" *ngIf="credit.creditStartDate && isAdmin">
                                <a routerLink="/admin/payments/listPayment/{{credit.idCredit}}" class="btn btn-outline-success"><i class="fa-solid fa-list-check"></i></a>
                                <a routerLink="details/{{credit.idCredit}}"  class="btn btn-outline-warning"><i class="fa-solid fa-circle-info"></i></a>
                                <button (click)="delete(credit)"  class="btn btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                            </td>
                            <td class="group-btn" *ngIf="!credit.creditStartDate && isAdmin">
                              <a routerLink="/admin/payments/listPayment/{{credit.idCredit}}" class="btn btn-outline-success"><i class="fa-solid fa-list-check"></i></a>
                              <a routerLink="details/{{credit.idCredit}}"  class="btn btn-outline-warning"><i class="fa-solid fa-circle-info"></i></a>
                              <button (click)="delete(credit)"  class="btn btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                            </td>
                            <td class="group-btn" *ngIf="credit.creditStartDate && !isAdmin">
                              <a *ngIf="!creditPayment || creditPayment != credit" (click)="showPayments(credit)" class="btn btn-outline-success"><i class="fa-solid fa-circle-info"></i></a>
                              <a *ngIf="creditPayment && creditPayment == credit" (click)="hidePayments()" class="btn btn-outline-success"><i class="fa-solid fa-minus"></i></a>
                              <button routerLink="/client/payement/payCredit"  class="btn btn-outline-warning" [disabled]="credit.isPayed"><i class="fa-solid fa-money-bill"></i></button>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="creditPayment && !isAdmin">
      <app-payements-by-credit [credit]="creditPayment"></app-payements-by-credit>
    </div>
