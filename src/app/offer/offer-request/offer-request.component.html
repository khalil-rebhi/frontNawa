<div class="container-fluid" style="margin-top: 1rem;">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="form-validation">
                        <form class="form-valide" #form="ngForm" novalidate="novalidate" (ngSubmit)="submitRequest()">
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="businessAddress">Business address
                                </label>
                                <div class="col-lg-6">
                                    <input type="text" class="form-control" id="businessAddress" name="businessAddress" [(ngModel)]="offerRequest.businessAddress" #name="ngModel" placeholder="Enter your business address" required>
                                    <div *ngIf="name.touched && name.invalid">
                                        <div class="alert alert-danger" *ngIf="name.errors?.['required']">
                                            Please enter your business address
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="experience">If you have any experience please mention it.
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="experience" name="experience" placeholder="0" [(ngModel)]="offerRequest.experience" #experience="ngModel" required>
                                    <div *ngIf="experience.touched">
                                        <div class="alert alert-danger" *ngIf="experience.errors?.['required']">
                                            Please enter your experience.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="amount">How much do you expect your project needs?
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="amount" name="amount" placeholder="0" [(ngModel)]="offerRequest.offer.demandedAmount" #amount="ngModel" required>
                                    <div *ngIf="amount.touched">
                                        <div class="alert alert-danger" *ngIf="amount.errors?.['required']">
                                            Please enter your amount.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="duration">After how many months you can pay your credit?
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="duration" name="duration" placeholder="0" [(ngModel)]="offerRequest.offer.credit.duration" #duration="ngModel" required>
                                    <div *ngIf="duration.touched">
                                        <div class="alert alert-danger" *ngIf="duration.errors?.['required']">
                                            Please enter your duration.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="interestRate">Approximativly how much interest rate you think it's convenable?
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="interestRate" name="interestRate" placeholder="0" [(ngModel)]="offerRequest.offer.credit.interestRate" #interestRate="ngModel" required>
                                    <div *ngIf="interestRate.touched">
                                        <div class="alert alert-danger" *ngIf="interestRate.errors?.['required']">
                                            Please enter your interestRate.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="minAmount">How much the minimum amount you expect to get?
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="minAmount" name="minAmount" placeholder="0" [(ngModel)]="offerRequest.offer.minAmount" #min="ngModel" required>
                                    <div *ngIf="min.touched && min.invalid">
                                        <div class="alert alert-danger" *ngIf="min.errors?.['required']">
                                            Please enter the minimum amount.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="maxAmount">How much the maximum amount you expect to get?
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="maxAmount" name="maxAmount" placeholder="0" [(ngModel)]="offerRequest.offer.maxAmount" #max="ngModel" required>
                                    <div *ngIf="max.touched">
                                        <div class="alert alert-danger" *ngIf="max.errors?.['required']">
                                            Please enter the maximum amount.
                                        </div>
                                        <div class="alert alert-danger" *ngIf="offerRequest.offer.minAmount > offerRequest.offer.maxAmount">
                                            Maximum amount should be greater than minimum amount.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="offerRequestType">What's your business type?
                                </label>
                                <div class="col-lg-6">
                                    <select class="form-control" id="offerRequestType" name="offerRequestType" [(ngModel)]="offerRequest.offer.typeOffer">
                                        <option value="INDUSTRIAL_CREDIT">Industrial credit</option>
                                        <option value="AGRICULTURE_CREDIT">Agriculture credit</option>
                                        <option value="EDUCATION_CREDIT">Education credit</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-lg-8 ml-auto">
                                    <button type="button" routerLink="/admin/offerRequest" class="btn btn-danger">Cancel</button>
                                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
