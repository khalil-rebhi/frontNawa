<div class="container-fluid" style="margin-top: 1rem;">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="form-validation">
                        <form class="form-valide" #form="ngForm" novalidate="novalidate" (ngSubmit)="editOffer()">
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="offer-name">Offer name
                                </label>
                                <div class="col-lg-6">
                                    <input type="text" class="form-control" id="offer-name" name="offer-name" [(ngModel)]="offer.name" #name="ngModel" placeholder="Enter the offer name" required>
                                    <div *ngIf="name.touched && name.invalid">
                                        <div class="alert alert-danger" *ngIf="name.errors?.['required']">
                                            The offer name is mandatory.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="minAmount">Minimum amount
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="minAmount" name="minAmount" placeholder="0" [(ngModel)]="offer.minAmount" #min="ngModel" required>
                                    <div *ngIf="min.touched && min.invalid">
                                        <div class="alert alert-danger" *ngIf="name.errors?.['required']">
                                            Please enter the minimum amount.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="maxAmount">Maximum amount
                                </label>
                                <div class="col-lg-6">
                                    <input type="number" class="form-control" id="maxAmount" name="maxAmount" placeholder="0" [(ngModel)]="offer.maxAmount" #max="ngModel" required>
                                    <div *ngIf="max.touched">
                                        <div class="alert alert-danger" *ngIf="max.errors?.['required']">
                                            Please enter the maximum amount.
                                        </div>
                                        <div class="alert alert-danger" *ngIf="offer.minAmount > offer.maxAmount">
                                            Maximum amount should be greater than minimum amount.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-lg-4 col-form-label" for="offerType">Offer type
                                </label>
                                <div class="col-lg-6">
                                    <select class="form-control" id="offerType" name="offerType" [(ngModel)]="offer.typeOffer">
                                        <option value="INDUSTRIAL_CREDIT">Industrial credit</option>
                                        <option value="AGRICULTURE_CREDIT">Agriculture credit</option>
                                        <option value="EDUCATION_CREDIT">Education credit</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-lg-8 ml-auto">
                                    <button type="button" routerLink="/admin/offer" class="btn btn-danger">Cancel</button>
                                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
