
<div class="container-fluid">
<div class="row d-flex justify-content-around">
    <a routerLink="new" class="btn btn-outline-primary w-25"><i class="fa-solid fa-plus"></i>New Offer</a>
</div>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Offers</h4>
          <div class="table-responsive">
            <div
              id="DataTables_Table_0_wrapper"
              class="dataTables_wrapper container-fluid dt-bootstrap4"
            >
              <div class="row">
                <div class="col-sm-12">
                  <table
                    class="table table-striped table-bordered zero-configuration dataTable"
                    id="DataTables_Table_0"
                    role="grid"
                    aria-describedby="DataTables_Table_0_info"
                  >
                    <thead class="text-center">
                      <tr role="row">
                        <th
                          class="_asc"
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-sort="ascending"
                          aria-label="Name: activate to sort column descending"
                          style="width: 55.812px"
                        >
                          Id
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Position: activate to sort column ascending"
                          style="width: 177.156px"
                        >
                          Name
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Office: activate to sort column ascending"
                          style="width: 127.172px"
                        >
                          Type
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Age: activate to sort column ascending"
                          style="width: 142.828px"
                        >
                          Minimum amount
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Start date: activate to sort column ascending"
                          style="width: 142.828px"
                        >
                          Maximum amount
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Salary: activate to sort column ascending"
                          style="width: 152.828px"
                        >
                          Demanded amount
                        </th>
                        <th
                          class=""
                          tabindex="0"
                          aria-controls="DataTables_Table_0"
                          rowspan="1"
                          colspan="1"
                          aria-label="Salary: activate to sort column ascending"
                          style="width: 100.828px"
                        >
                          Status
                        </th>
                        <th
                        class=""
                        tabindex="0"
                        aria-controls="DataTables_Table_0"
                        rowspan="1"
                        colspan="1"
                        aria-label="Start date: activate to sort column ascending"
                        style="width: 182.828px"
                      >
                        Action
                      </th>
                      </tr>
                    </thead>
                    <tbody class="text-center">
                      <tr role="row" class="odd" *ngFor="let offer of listOffers">
                        <td class="_1">{{ offer.idOffer }}</td>
                        <td>{{ offer.name }}</td>
                        <td>{{ offer.typeOffer }}</td>
                        <td>{{ offer.minAmount }}</td>
                        <td>{{ offer.maxAmount }}</td>
                        <td>{{ offer.demandedAmount }}</td>
                        <td>
                          <span *ngIf="offer.credit.amount == null"><i class="fa-solid fa-spinner fa-spin"></i></span>
                          <span *ngIf="offer.credit.amount != null">Accepted</span>
                          {{ offer.credit.amount}}
                        </td>
                        <td class="group-btn" *ngIf="offer.credit.amount != null">
                          <a routerLink="detail/{{ offer.idOffer }}" class="btn btn-outline-success"><i class="fa-solid fa-circle-info"></i></a>
                          <a  routerLink="edit/{{ offer.idOffer }}" class="btn btn-outline-warning"><i class="fa-solid fa-pen-to-square"></i></a>
                          <button (click)="delete(offer)"  class="btn btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                        </td>
                        <td class="group-btn" *ngIf="offer.credit.amount == null">
                          <a (click)="accept(offer)" class="btn btn-outline-success"><i class="fa-solid fa-check fa-l"></i></a>
                          <a   class="btn btn-outline-warning"><i class="fa-solid fa-circle-info"></i></a>
                          <button onclick="alert('Are you sure')"  class="btn btn-outline-danger"><i class="fa-solid fa-x"></i></button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div *ngIf="acceptingOffer" (accepted)="afterAccept()">
  <app-accept-offer-admin [offer]="acceptingOffer"></app-accept-offer-admin>
</div>
