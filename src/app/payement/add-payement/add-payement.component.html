<form (ngSubmit)="addProduct(payement)" #form ="ngForm"> 
    <div class="form-group" >
<label> titre</label>
<input type ="text" class="form-control" name ="title" [(ngModel)]="payement.amount" required minlength="3" #title = "ngModel">
<div *ngIf="title.touched && title.invalid">
<div class="alert alert-danger" *ngIf="title.errors?.['required']" >title is not required</div>
<div class="alert alert-danger" *ngIf="title.errors?.['minlength']" >title is less than 3</div>
</div>
</div>

        <div class="form-group" >
        <label> prix</label>
        <input type ="text"  name ="price" class="form-control" [(ngModel)]="payement.score"  required  #price="ngModel">
        <div *ngIf="price.touched && price.invalid">
            <div class="alert alert-danger" *ngIf="price.errors?.['required']" >title is not required</div>


            <div class="alert alert-danger" *ngIf="title.errors?.['required']" >price is not required</div>
            
        </div>
        </div>
            
                            <button class="btn btn-primary" type="submit"[disabled]="form.invalid" > ajouter</button>
                        </form>
